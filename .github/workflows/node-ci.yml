# Reusable CI for Node / Next.js / Astro / Expo repos.
#
# Caller (in the app repo, .github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: LapserLtd/.github/.github/workflows/node-ci.yml@main
#       with:
#         test: npm run test:unit
#
# Required status check for branch protection: "ci / verify"
# (plus "ci / e2e" when playwright: true).
#
# Every step gates. The only exception is `npm audit`, which reports but does
# not fail the job: advisories land on transitive deps without any code change,
# and a red main nobody can fix the same day trains people to ignore red.
# Audit output goes to the job summary; triage it, don't mute it.
#
# Commands are passed through env and eval'd rather than templated into `run:`
# so no expression is ever spliced into shell source.

name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version. One org-wide version; change it here, not per repo.
        type: string
        default: '22'
      working-directory:
        description: Directory containing package.json and package-lock.json.
        type: string
        default: '.'
      lint:
        description: Lint command. Empty string skips.
        type: string
        default: npm run lint
      typecheck:
        description: Typecheck command. Empty string skips.
        type: string
        default: npx --no-install tsc --noEmit
      format:
        description: Formatting check (e.g. npx prettier --check .). Empty string skips.
        type: string
        default: ''
      build:
        description: Build command. Empty string skips.
        type: string
        default: npm run build
      test:
        description: Unit test command (e.g. npm run test:unit). Empty string skips.
        type: string
        default: ''
      env:
        description: Extra NON-SECRET environment, one KEY=VALUE per line, applied to every step.
        type: string
        default: ''
      audit:
        description: Run npm audit (report only, never fails the job).
        type: boolean
        default: true
      playwright:
        description: >-
          Run Playwright after verify passes. The repo's playwright.config must
          define a webServer that boots the app when CI=true; this workflow does
          not start anything itself.
        type: boolean
        default: false
      playwright-command:
        type: string
        default: npx --no-install playwright test
      playwright-browsers:
        type: string
        default: chromium

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Export extra env
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          printf '%s\n' "$EXTRA_ENV" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! printf '%s' "$line" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::env input line is not KEY=VALUE: ${line%%=*}"
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done

      - name: Install
        id: install
        run: npm ci --no-audit --no-fund

      # Report-only by design; see header comment.
      - name: npm audit (report only)
        if: inputs.audit && !cancelled() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '### npm audit (production deps, high+)'
            echo '```'
            npm audit --omit=dev --audit-level=high 2>&1 | tail -n 60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint
        if: inputs.lint != '' && !cancelled() && steps.install.outcome == 'success'
        env:
          CMD: ${{ inputs.lint }}
        run: eval "$CMD"

      - name: Typecheck
        if: inputs.typecheck != '' && !cancelled() && steps.install.outcome == 'success'
        env:
          CMD: ${{ inputs.typecheck }}
        run: eval "$CMD"

      - name: Format check
        if: inputs.format != '' && !cancelled() && steps.install.outcome == 'success'
        env:
          CMD: ${{ inputs.format }}
        run: eval "$CMD"

      - name: Unit tests
        if: inputs.test != '' && !cancelled() && steps.install.outcome == 'success'
        env:
          CMD: ${{ inputs.test }}
        run: eval "$CMD"

      - name: Build
        if: inputs.build != '' && !cancelled() && steps.install.outcome == 'success'
        env:
          CMD: ${{ inputs.build }}
        run: eval "$CMD"

  e2e:
    name: e2e
    if: inputs.playwright
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Export extra env
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          printf '%s\n' "$EXTRA_ENV" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! printf '%s' "$line" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::env input line is not KEY=VALUE: ${line%%=*}"
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: eval "npx --no-install playwright install --with-deps $BROWSERS"

      - name: Playwright
        env:
          CMD: ${{ inputs.playwright-command }}
        run: eval "$CMD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/test-results/
          retention-days: 14
          if-no-files-found: ignore
